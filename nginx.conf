## ═══════════════════════════════════════════════════════════════════════════
## P.Care Pharma — nginx site
##
## Target Domain:   pcare-pharma.com (and www.pcare-pharma.com)
## Supabase Host:   ddkrmtowuxfajpjvwjck.supabase.co
##
## Installation:
##   sudo cp nginx.conf.template /etc/nginx/sites-available/pcare
##   sudo ln -s /etc/nginx/sites-available/pcare /etc/nginx/sites-enabled/pcare
##   sudo nginx -t && sudo systemctl reload nginx
##
## Assumes the release is at /srv/pcare/current (frontend/dist built) and the
## API is listening on 127.0.0.1:4000 (ecosystem.config.js).
##
## First install, before a certificate exists: the two :443 server blocks name
## certificate files that are not there yet, and `nginx -t` fails on them.
## Comment both out, reload, issue the certificate through the :80 block's
## webroot, then restore them and reload again:
##   sudo mkdir -p /var/www/certbot
##   sudo certbot certonly --webroot -w /var/www/certbot \
##        -d pcare-pharma.com -d www.pcare-pharma.com --deploy-hook "systemctl reload nginx"
##
## Written for the nginx in Ubuntu 24.04 (1.24): `listen ... ssl http2`, not the
## `http2 on;` directive, which 1.24 does not have.
## ═══════════════════════════════════════════════════════════════════════════


# ── http level ──────────────────────────────────────────────────────────────
# sites-enabled/* is included from inside http{} in /etc/nginx/nginx.conf, so
# directives at the top of this file sit at http level, the only place
# limit_req_zone, limit_conn_zone and map are allowed. The previous template
# declared its zone inside server{}, which nginx rejects outright.

# Login, counted per client address. The shop's devices share one public IP,
# so this is generous; the per-account limit in auth.service.js is the real
# brute-force control.
limit_req_zone $binary_remote_addr zone=pcare_login:10m rate=10r/m;

# Invoice upload. Only POSTs count: GET on the same path is the invoice list,
# and a request whose key is empty is not limited at all.
map $request_method $pcare_upload_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone  $pcare_upload_key zone=pcare_upload:10m rate=6r/m;
limit_conn_zone $pcare_upload_key zone=pcare_upload_conn:10m;

# Cache-Control by path, emitted by ONE add_header at server level. In nginx an
# add_header inside a location discards every add_header inherited from the
# server block, so a location setting its own Cache-Control would silently
# strip HSTS and the CSP from that path.
map $uri $pcare_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";  # content-hashed file names
    ~^/api/     "";                                     # empty: not added, the API decides
    default     "no-cache";                             # index.html must revalidate after a deploy
}


# ── :80 — certificate challenges, and the redirect to https ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pcare-pharma.com www.pcare-pharma.com;

    # Plain http for good, not just for the first issuance: renewals use it
    # too. The previous template redirected everything, the challenge included.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://pcare-pharma.com$request_uri;
    }
}


# ── :443 www — one canonical host ───────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pcare-pharma.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pcare-pharma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcare-pharma.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://pcare-pharma.com$request_uri;
}


# ── :443 — the application ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pcare-pharma.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pcare-pharma.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pcare-pharma.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pcare_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/pcare.access.log;
    error_log  /var/log/nginx/pcare.error.log warn;

    # ── Response headers, declared once, here. No location below may use
    # add_header (see the Cache-Control map above for why).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Same allowances as helmet's policy in backend/src/app.js, which applies
    # when the API serves the SPA itself; keep the two in step. The Supabase
    # host is for Module 23's review screen, which shows the original invoice
    # in an <iframe> or <img> from a signed Storage URL. No inline script is
    # allowed: the theme bootstrap is frontend/public/theme-init.js for that reason.
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ddkrmtowuxfajpjvwjck.supabase.co; frame-src 'self' https://ddkrmtowuxfajpjvwjck.supabase.co; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header Cache-Control             $pcare_cache_control always;

    # helmet sends its own copy of several of these on API responses. Hidden so
    # an API response carries one set rather than two that disagree (helmet's
    # X-Frame-Options is SAMEORIGIN, this file's is DENY).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    # ── Proxy defaults, inherited by every proxying location below. A location
    # that declares any proxy_set_header of its own loses ALL of these, so none does.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwritten, never passed through: requestContext.js writes this id into
    # every log line and would otherwise trust whatever a client sent.
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    # ── nginx's own refusals, in the API's JSON error shape, so the app can
    # show the message instead of failing to parse an HTML page.
    limit_req_status  429;
    limit_conn_status 429;
    error_page 429 = @pcare_rate_limited;
    error_page 413 = @pcare_too_large;

    location @pcare_rate_limited {
        default_type application/json;
        return 429 '{"error":"RATE_LIMITED","message":"Too many requests. Wait a minute and try again."}';
    }

    location @pcare_too_large {
        default_type application/json;
        return 413 '{"error":"FILE_TOO_LARGE","message":"That file is too large to upload."}';
    }

    # ── API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location = /api/v1/auth/login {
        limit_req zone=pcare_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }

    location = /api/v1/supplier-invoices {
        limit_req  zone=pcare_upload burst=3 nodelay;
        limit_conn pcare_upload_conn 2;
        # A 12MB invoice (INVOICE_MAX_UPLOAD_MB) plus multipart overhead. nginx's
        # 1m default refused every real invoice before the API saw it. Kept above
        # the API's own limit, so the API's FILE_TOO_LARGE message is the usual one.
        client_max_body_size 15m;
        client_body_timeout  120s;
        # The read is synchronous: up to GEMINI_TIMEOUT_MS (120s) per attempt, for
        # up to GEMINI_MAX_ATTEMPTS (2) attempts. A 60s timeout cut off every slow
        # read with a 504 while the API was still working on it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:4000;
    }

    # ── Health (process up) and readiness (database reachable), for monitoring
    location = /health { proxy_pass http://127.0.0.1:4000; access_log off; }
    location = /ready  { proxy_pass http://127.0.0.1:4000; access_log off; }

    # ── The SPA. Served by nginx rather than Express, so the login page still
    # loads while the API restarts during a deploy.
    root  /srv/pcare/current/frontend/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dotfiles (.env, .git) are never served, whatever lands in the web root.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
