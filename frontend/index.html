<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="P.Care Pharma — Pharmacy Management System" />
    <!-- Matches --color-surface-base (#EFF4F1 light / #0F1714 dark). Kept in sync with tokens.css:
         the browser chrome cannot read a CSS variable. -->
    <meta name="theme-color" content="#EFF4F1" />
    <title>P.Care Pharma</title>
    <!-- Theme before first paint. A file, not an inline script: the Content-Security-Policy
         (helmet in backend/src/app.js, and nginx.conf.template) is script-src 'self', which
         blocks inline scripts. Plain rather than type="module", because modules are deferred. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
